<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="%THEME_LIGHT%" />
    <title>Page introuvable · %APP_NAME%</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: %THEME_LIGHT%;
        --panel: #e7edcf;
        --ink: #1d2616;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: %THEME_DARK%;
          --panel: #232c19;
          --ink: #dbe7b5;
        }
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 16px;
        box-sizing: border-box;
        background: var(--bg);
        color: var(--ink);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      main {
        max-width: 28rem;
        padding: 20px;
        background: var(--panel);
        border: 3px solid var(--ink);
        box-shadow: 4px 4px 0 var(--ink);
        text-align: center;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 1.25rem;
      }
      a {
        display: inline-block;
        margin-top: 8px;
        padding: 10px 16px;
        border: 3px solid var(--ink);
        box-shadow: 3px 3px 0 var(--ink);
        color: inherit;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main id="message">
      <h1>Page introuvable</h1>
      <p>Cette page n’existe pas (ou plus). La grille du jour vous attend.</p>
      <a href="%BASE_URL%">Retour à %APP_NAME%</a>
    </main>
    <script>
      // GitHub Pages answers every unknown path with this page. The app lives on hash routes
      // (#/faq…): if the path names one of them (/faq, /archives…), send the visitor there.
      (function () {
        var base = '%BASE_URL%';
        var path = location.pathname;
        if (path.indexOf(base) !== 0) return;
        var page = path
          .slice(base.length)
          .replace(/\/+$/, '')
          .replace(/\.html$/, '');
        var pages = { faq: 1, changelog: 1, legal: 1, archives: 1 };
        if (Object.prototype.hasOwnProperty.call(pages, page)) {
          location.replace(base + location.search + '#/' + page);
        }
      })();
    </script>
  </body>
</html>

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Just after Paris midnight, in summer time (UTC+2) and in winter time (UTC+1): each build
  # publishes the grids up to today (Paris), so the grid of the new day goes live a few minutes
  # after midnight. (The client asks again every minute until it is there.)
  schedule:
    - cron: '3 22 * * *'
    - cron: '3 23 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: packages/data/.cache
          key: data-${{ hashFiles('packages/data/src/config.ts') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pokeneuf/web build
        env:
          # Served under https://<user>.github.io/<repo>/. Use "/" with a custom domain.
          VITE_BASE: /${{ github.event.repository.name }}/
      # The repository holds the next 90 days of grids; the site only gets today's and the past ones.
      - run: pnpm grids:publish --dir apps/web/dist/grids
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
